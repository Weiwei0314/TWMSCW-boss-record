<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楓之谷攻王計時器</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --text:#1c1f26; --muted:#6b7280; --border:#e2e4e9;
    --idle:#eceef1; --idle-text:#6b7280;
    /* 自己擊殺：綠色；別人擊殺：紫色 */
    --me:#16a34a; --me-bg:#bbf7d0; --me-text:#14532d;
    --other:#7c3aed; --other-bg:#e9d5ff; --other-text:#4c1d95;
    --window-bg:#fef3c7; --window-text:#92400e; --window-border:#f59e0b;
    --ready-bg:#fee2e2; --ready-text:#991b1b; --ready-border:#ef4444;
    --accent:#2563eb; --accent-text:#ffffff; --danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161b; --panel:#1d2027; --text:#e7e9ee; --muted:#9aa1ad; --border:#2b2f3a;
      --idle:#2a2e38; --idle-text:#9aa1ad;
      --me:#22c55e; --me-bg:#14532d; --me-text:#bbf7d0;
      --other:#a78bfa; --other-bg:#3b1a6b; --other-text:#e9d5ff;
      --window-bg:#4a3306; --window-text:#fcd34d; --window-border:#f59e0b;
      --ready-bg:#4c1414; --ready-text:#fca5a5; --ready-border:#ef4444;
      --accent:#3b82f6; --accent-text:#0b0f19; --danger:#f87171;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;padding-bottom:40px;}
  h1{font-size:1.25rem;margin:0 0 4px;}
  h3{font-size:.9rem;margin:16px 0 8px;color:var(--muted);}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px;}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
  .clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;}
  select,input,button{font-family:inherit;font-size:.9rem;}
  select,input[type=number],input[type=datetime-local],input[type=text]{
    background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;
  }
  button{cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 12px;}
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600;}
  .btn-danger{color:var(--danger);border-color:var(--danger);background:transparent;}
  .btn-me{background:var(--me);border-color:var(--me);color:#fff;font-weight:700;}
  .btn-other{background:var(--other);border-color:var(--other);color:#fff;font-weight:700;}
  .spacer{flex:1;}

  /* 常駐（黏在畫面頂端）的「我的擊殺」列 */
  .mybar{position:sticky;top:0;z-index:20;background:var(--panel);border:2px solid var(--me);border-radius:12px;padding:8px 12px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .mybar-stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.85rem;}
  .mybar-stats b{font-size:1.05rem;font-variant-numeric:tabular-nums;}
  .stat-me b{color:var(--me);}
  .stat-other b{color:var(--other);}
  .mybar-stats button{padding:2px 8px;font-size:.75rem;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .chips .none{color:var(--muted);font-size:.8rem;}
  .chip{font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;color:#fff;background:var(--me);border:none;}
  .chip.window{background:var(--window-border);color:#1c1f26;}
  .chip.ready{background:var(--ready-border);}

  .summary{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:8px;}
  .summary b{color:var(--text);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}

  /* 固定每排 6 個頻道；畫面太窄時左右捲動 */
  .grid-scroll{overflow-x:auto;padding-bottom:4px;}
  .grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:14px 8px;}
  .card{border:1.5px solid var(--border);border-left-width:6px;border-radius:10px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:4px;scroll-margin-top:140px;}
  .card.idle{background:var(--idle);}
  .card.me{border-left-color:var(--me);}
  .card.other{border-left-color:var(--other);}
  .card.waiting.me{background:var(--me-bg);border-color:var(--me);}
  .card.waiting.other{background:var(--other-bg);border-color:var(--other);}
  .card.window{background:var(--window-bg);border-top-color:var(--window-border);border-right-color:var(--window-border);border-bottom-color:var(--window-border);animation:pulse-amber 1.4s ease-in-out infinite;}
  .card.ready{background:var(--ready-bg);border-top-color:var(--ready-border);border-right-color:var(--ready-border);border-bottom-color:var(--ready-border);animation:pulse-red 1.1s ease-in-out infinite;}
  .card.flash{outline:3px solid var(--accent);outline-offset:2px;}
  @keyframes pulse-amber{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.35);}50%{box-shadow:0 0 0 6px rgba(245,158,11,0);}}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45);}50%{box-shadow:0 0 0 7px rgba(239,68,68,0);}}
  .ch-head{display:flex;align-items:center;gap:6px;}
  .ch-num{font-weight:700;font-size:.95rem;}
  .owner-badge{font-size:.7rem;font-weight:700;color:#fff;padding:1px 6px;border-radius:6px;cursor:pointer;border:none;}
  .owner-badge.me{background:var(--me);}
  .owner-badge.other{background:var(--other);}
  .pin-btn{margin-left:auto;padding:1px 5px;font-size:.75rem;opacity:.45;background:transparent;}
  .pin-btn.on{opacity:1;border-color:var(--accent);}
  .status-tag{font-size:.72rem;font-weight:700;}
  .idle .status-tag{color:var(--idle-text);}
  .waiting.me .status-tag,.waiting.me .countdown{color:var(--me-text);}
  .waiting.other .status-tag,.waiting.other .countdown{color:var(--other-text);}
  .window .status-tag,.window .countdown{color:var(--window-text);}
  .ready .status-tag,.ready .countdown{color:var(--ready-text);}
  .info-line{font-size:.7rem;color:var(--muted);min-height:1.1em;}
  .waiting .info-line{color:inherit;opacity:.8;}
  .countdown{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;}
  .idle .countdown{color:var(--idle-text);font-size:.8rem;font-weight:400;}
  .card-actions{display:flex;gap:4px;}
  .card-actions button{flex:1;padding:5px 2px;font-size:.72rem;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:100%;max-width:380px;}
  .modal h2{margin-top:0;font-size:1.05rem;}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:.8rem;color:var(--muted);}
  .row2{display:flex;gap:8px;}
  .row2 > *{flex:1;}
  .radio-row{display:flex;gap:14px;font-size:.85rem;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .empty-hint{color:var(--muted);font-size:.9rem;padding:30px 10px;text-align:center;}
  .modal.wide{max-width:560px;}
  .daily-scroll{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .daily-table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;}
  .daily-table th,.daily-table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  .daily-table th:first-child,.daily-table td:first-child{text-align:left;}
  .daily-table thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;}
  .daily-table td.me{color:var(--me);font-weight:700;}
  .daily-table td.other{color:var(--other);font-weight:700;}
  .daily-table tr.today td{background:var(--idle);}
  .daily-table td.cum{color:var(--muted);}
  /* 時間熱點：星期 × 小時 */
  :root{--heat-rgb:234,88,12;}
  .modal.xwide{max-width:900px;}
  .filter-row{display:flex;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px;}
  .filter-row .field{margin-bottom:0;}
  .heat-top{font-size:.85rem;margin-bottom:8px;line-height:1.6;}
  .heat-top b{color:rgb(var(--heat-rgb));font-variant-numeric:tabular-nums;}
  .heat-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;padding:4px;}
  .heat-table{border-collapse:separate;border-spacing:2px;font-size:.7rem;font-variant-numeric:tabular-nums;width:100%;}
  .heat-table th{color:var(--muted);font-weight:600;padding:2px;text-align:center;}
  .heat-table td{min-width:24px;height:24px;text-align:center;border-radius:4px;color:var(--text);}
  .heat-table td.zero{background:var(--idle);}
  .heat-table .lbl{text-align:left;white-space:nowrap;padding-right:6px;color:var(--muted);font-weight:600;background:transparent;}
  .heat-table .sum{color:var(--muted);background:transparent;padding-left:6px;}
  .heat-table tr.total td,.heat-table tr.total th{border-top:6px solid transparent;background-clip:padding-box;}
  .heat-note{font-size:.75rem;color:var(--muted);margin-top:8px;}
  [hidden]{display:none!important;}

  /* 浮動小視窗 */
  body.mini{padding:8px;scrollbar-width:none;}
  body.mini::-webkit-scrollbar{display:none;}
  body.mini .mini-title{font-weight:700;font-size:.95rem;margin-bottom:4px;}
  body.mini .mybar{position:static;box-shadow:none;}
  .mini-next{margin-top:8px;font-size:1rem;}
  .mini-next b{font-size:1.6rem;color:var(--me);}
  .mini-label{margin-top:6px;font-size:.78rem;color:var(--muted);}
  .mini-ranges{margin-top:2px;font-size:.95rem;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums;word-break:break-word;}
  .range-btn{font:inherit;font-weight:700;padding:0 5px;margin:1px 0;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--text);}
  .range-btn:hover{border-color:var(--danger);color:var(--danger);text-decoration:line-through;}
  .mini-round{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .mini-round input{width:48px;padding:3px 6px;text-align:center;-moz-appearance:textfield;appearance:textfield;}
  .mini-round input::-webkit-inner-spin-button,.mini-round input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .mini-round button{padding:3px 8px;font-size:.75rem;}
  .mini-next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mini-next button{padding:3px 8px;font-size:.75rem;}
  .soon-list{display:flex;flex-direction:column;gap:3px;margin-top:3px;}
  .soon-row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;border:1.5px solid transparent;background:var(--idle);color:var(--text);font-size:.85rem;font-variant-numeric:tabular-nums;}
  .soon-jump{flex:1;display:flex;justify-content:space-between;gap:8px;cursor:pointer;}
  .soon-x{padding:0 6px;font-size:.72rem;line-height:1.4;background:transparent;color:inherit;border-color:currentColor;}
  .early{font-size:.82rem;margin-top:3px;font-variant-numeric:tabular-nums;}
  .early.me b{color:var(--me);}
  .early.other b{color:var(--other);}
  .mini-ranges.prio .range-btn{border-color:var(--me);color:var(--me);}
  body.mini .mini-next + .btn-primary{margin-top:6px;}
  .soon-row.window{background:var(--window-bg);color:var(--window-text);}
  /* 最接近重生的那一筆：黃紅交替閃爍 */
  .soon-row.top{font-size:1.05rem;font-weight:700;padding:5px 8px;animation:soon-top 1s ease-in-out infinite;}
  @keyframes soon-top{
    0%,100%{background:var(--window-bg);color:var(--window-text);border-color:var(--window-border);}
    50%{background:var(--ready-bg);color:var(--ready-text);border-color:var(--ready-border);}
  }
</style>
</head>
<body>

<h1>⚔️ 楓之谷攻王計時器</h1>
<div class="sub">經典版 60 頻道 · 各頻道獨立計時 · 資料僅存在本機瀏覽器 (localStorage)</div>

<div class="topbar">
  <div class="clock" id="clock">--:--:--</div>
  <div class="spacer"></div>
  <button id="miniBtn" title="開一個永遠在最上層的小視窗，切到遊戲也看得到">🪟 浮動小視窗</button>
  <select id="bossSelect"></select>
  <button id="editBossBtn">編輯王</button>
  <button id="addBossBtn" class="btn-primary">+ 新增王</button>
  <button id="clearAllBtn" class="btn-danger">清除全部紀錄</button>
  <button id="deleteBossBtn" class="btn-danger">刪除此王</button>
</div>

<!-- 黏在頂端：我的擊殺 -->
<div class="mybar" id="myBar" hidden></div>

<div class="summary" id="summary" hidden>
  <span><span class="dot" style="background:var(--me)"></span>自己擊殺</span>
  <span><span class="dot" style="background:var(--other)"></span>別人擊殺</span>
  <span><span class="dot" style="background:var(--window-border)"></span>重生區間中：<b id="cntWindow">0</b></span>
  <span><span class="dot" style="background:var(--ready-border)"></span>已重生：<b id="cntReady">0</b></span>
  <span>等待中：<b id="cntWaiting">0</b></span>
  <span>排序：
    <select id="sortMode" style="font-size:.75rem;padding:2px 6px;">
      <option value="channel">依頻道</option>
      <option value="time">依重生時間（最緊急優先）</option>
    </select>
  </span>
</div>

<div id="gridArea"></div>

<!-- Boss add/edit modal -->
<div class="modal-overlay" id="bossModalOverlay" hidden>
  <div class="modal">
    <h2 id="bossModalTitle">新增王</h2>
    <div class="field">
      <label>王的名稱</label>
      <input type="text" id="bossNameInput" placeholder="例如：潛水艇哥布林王">
    </div>
    <div class="field">
      <label>重生時間類型</label>
      <div class="radio-row">
        <label><input type="radio" name="respawnType" value="fixed" checked> 固定時間</label>
        <label><input type="radio" name="respawnType" value="range"> 區間隨機</label>
      </div>
    </div>
    <div id="fixedFields">
      <div class="field">
        <label>固定重生時間</label>
        <div class="row2">
          <input type="number" id="fixedHour" min="0" placeholder="小時" value="2">
          <input type="number" id="fixedMinute" min="0" max="59" placeholder="分鐘" value="0">
        </div>
      </div>
    </div>
    <div id="rangeFields" hidden>
      <div class="field">
        <label>最短重生時間</label>
        <div class="row2">
          <input type="number" id="minHour" min="0" placeholder="小時" value="2">
          <input type="number" id="minMinute" min="0" max="59" placeholder="分鐘" value="0">
        </div>
      </div>
      <div class="field">
        <label>最長重生時間</label>
        <div class="row2">
          <input type="number" id="maxHour" min="0" placeholder="小時" value="3">
          <input type="number" id="maxMinute" min="0" max="59" placeholder="分鐘" value="0">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="bossModalCancel">取消</button>
      <button id="bossModalSave" class="btn-primary">儲存</button>
    </div>
  </div>
</div>

<!-- Manual time edit modal -->
<div class="modal-overlay" id="timeModalOverlay" hidden>
  <div class="modal">
    <h2>手動設定擊殺時間 - <span id="timeModalChannel"></span></h2>
    <div class="field">
      <label>擊殺時間</label>
      <input type="datetime-local" id="manualTimeInput">
    </div>
    <div class="field">
      <label>誰擊殺的</label>
      <div class="radio-row">
        <label><input type="radio" name="timeOwner" value="me" checked> 自己</label>
        <label><input type="radio" name="timeOwner" value="other"> 別人</label>
      </div>
    </div>
    <div class="modal-actions">
      <button id="timeModalCancel">取消</button>
      <button id="timeModalSave" class="btn-primary">套用</button>
    </div>
  </div>
</div>

<!-- 每日擊殺統計 -->
<div class="modal-overlay" id="dailyModalOverlay" hidden>
  <div class="modal wide">
    <h2>📅 每日擊殺統計</h2>
    <div class="field">
      <label>統計範圍</label>
      <select id="dailyScope">
        <option value="boss">目前這隻王</option>
        <option value="all">所有王合計</option>
      </select>
    </div>
    <div id="dailyBody"></div>
    <div class="modal-actions">
      <button id="dailyModalClose" class="btn-primary">關閉</button>
    </div>
  </div>
</div>

<!-- 擊殺時間熱點 -->
<div class="modal-overlay" id="heatModalOverlay" hidden>
  <div class="modal xwide">
    <h2>🔥 擊殺時間熱點</h2>
    <div class="filter-row">
      <div class="field">
        <label>統計範圍</label>
        <select id="heatScope">
          <option value="boss">目前這隻王</option>
          <option value="all">所有王合計</option>
        </select>
      </div>
      <div class="field">
        <label>誰擊殺的</label>
        <select id="heatWho">
          <option value="all">全部</option>
          <option value="me">只看自己</option>
          <option value="other">只看別人</option>
        </select>
      </div>
      <div class="field">
        <label>期間</label>
        <select id="heatRange">
          <option value="0">全部紀錄</option>
          <option value="7">最近 7 天</option>
          <option value="30">最近 30 天</option>
        </select>
      </div>
    </div>
    <div id="heatBody"></div>
    <div class="heat-note">擊殺時間約等於「發現王已重生」的時間，所以熱點代表王大多在這些時段被找到。顏色越深＝該時段擊殺越多；時間以本機時區計算。</div>
    <div class="modal-actions">
      <button id="heatModalClose" class="btn-primary">關閉</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'maple_boss_timer_v1';
const CHANNEL_COUNT = 60;
const COLS = 6;

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// 舊版資料：channels[ch] = 時間戳記 → 新版：{ ts, by, logId }，並建立擊殺紀錄 kills[]
function migrate(s){
  s.bosses = s.bosses || [];
  s.bosses.forEach(b => {
    b.channels = b.channels || {};
    b.kills = b.kills || [];
    b.pinned = b.pinned || [];
    // 掃頻輪次：起始頻道 + 本輪已看過（沒王）的頻道
    b.round = b.round || { start: CHANNEL_COUNT, checked: [] };
    b.round.pass = b.round.pass || 1;
    // 區間中被手動移除的擊殺紀錄 logId（重新擊殺會換新 logId，自動失效）
    b.dismissed = b.dismissed || [];
    Object.keys(b.channels).forEach(ch => {
      const v = b.channels[ch];
      if(typeof v === 'number'){
        const id = genId() + ch;
        b.channels[ch] = { ts: v, by: 'me', logId: id };
        b.kills.push({ id, ch: Number(ch), ts: v, by: 'me' });
      }
    });
  });
  return s;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return { bosses: [], activeBossId: null, sortMode: 'channel' };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();

function getActiveBoss(){
  return state.bosses.find(b => b.id === state.activeBossId) || null;
}

function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatClock(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function formatDuration(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function toLocalDatetimeInputValue(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}

function computeStatus(boss, killTs, nowMs){
  if(killTs == null) return { state:'idle' };
  if(boss.respawnType === 'fixed'){
    const respawnAt = killTs + boss.fixedMinutes*60000;
    if(nowMs < respawnAt) return { state:'waiting', targetTime: respawnAt, remainingMs: respawnAt - nowMs };
    return { state:'ready', overdueMs: nowMs - respawnAt };
  } else {
    const minAt = killTs + boss.minMinutes*60000;
    const maxAt = killTs + boss.maxMinutes*60000;
    if(nowMs < minAt) return { state:'waiting', targetTime:minAt, remainingMs: minAt-nowMs, maxTime:maxAt };
    if(nowMs <= maxAt) return { state:'window', targetTime:maxAt, remainingMs: maxAt-nowMs };
    return { state:'ready', overdueMs: nowMs - maxAt };
  }
}

// ---------- Kill records ----------
function addKill(boss, ch, ts, by){
  const id = genId();
  boss.kills.push({ id, ch, ts, by });
  boss.channels[ch] = { ts, by, logId: id };
  // 重新擊殺過的頻道，等王重生後要再回到掃頻清單
  if(boss.round) boss.round.checked = boss.round.checked.filter(c => c !== ch);
}
function findLog(boss, rec){ return rec ? boss.kills.find(k => k.id === rec.logId) : null; }

function countKills(boss){
  let me = 0, other = 0;
  boss.kills.forEach(k => { if(k.by === 'me') me++; else other++; });
  return { me, other, total: me + other };
}

// 以本機時間午夜 00:00 為一天的分界
function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function countToday(boss){
  const today = dayKey(Date.now());
  let me = 0, other = 0;
  boss.kills.forEach(k => { if(dayKey(k.ts) !== today) return; if(k.by === 'me') me++; else other++; });
  return { me, other, total: me + other };
}

// 依日期分組，回傳由新到舊的列，每列含當天數量與到當天為止的累積
function dailyRows(kills){
  const byDay = {};
  kills.forEach(k => {
    const key = dayKey(k.ts);
    const d = byDay[key] || (byDay[key] = { day: key, me: 0, other: 0 });
    if(k.by === 'me') d.me++; else d.other++;
  });
  const rows = Object.values(byDay).sort((a, b) => a.day < b.day ? -1 : 1);
  let cumMe = 0, cumAll = 0;
  rows.forEach(r => {
    r.total = r.me + r.other;
    cumMe += r.me; cumAll += r.total;
    r.cumMe = cumMe; r.cumAll = cumAll;
  });
  return rows.reverse();
}

// ---------- Boss modal ----------
const bossModalOverlay = document.getElementById('bossModalOverlay');
const bossModalTitle = document.getElementById('bossModalTitle');
const bossNameInput = document.getElementById('bossNameInput');
const fixedFields = document.getElementById('fixedFields');
const rangeFields = document.getElementById('rangeFields');
const fixedHour = document.getElementById('fixedHour');
const fixedMinute = document.getElementById('fixedMinute');
const minHour = document.getElementById('minHour');
const minMinute = document.getElementById('minMinute');
const maxHour = document.getElementById('maxHour');
const maxMinute = document.getElementById('maxMinute');

let editingBossId = null;

function openBossModal(boss){
  editingBossId = boss ? boss.id : null;
  bossModalTitle.textContent = boss ? '編輯王' : '新增王';
  bossNameInput.value = boss ? boss.name : '';
  const type = boss ? boss.respawnType : 'fixed';
  document.querySelectorAll('input[name=respawnType]').forEach(r => r.checked = (r.value === type));
  toggleTypeFields(type);
  if(boss && boss.respawnType === 'fixed'){
    fixedHour.value = Math.floor(boss.fixedMinutes/60);
    fixedMinute.value = boss.fixedMinutes%60;
  } else {
    fixedHour.value = 2; fixedMinute.value = 0;
  }
  if(boss && boss.respawnType === 'range'){
    minHour.value = Math.floor(boss.minMinutes/60);
    minMinute.value = boss.minMinutes%60;
    maxHour.value = Math.floor(boss.maxMinutes/60);
    maxMinute.value = boss.maxMinutes%60;
  } else {
    minHour.value = 2; minMinute.value = 0;
    maxHour.value = 3; maxMinute.value = 0;
  }
  bossModalOverlay.hidden = false;
}
function closeBossModal(){ bossModalOverlay.hidden = true; }

function toggleTypeFields(type){
  fixedFields.hidden = type !== 'fixed';
  rangeFields.hidden = type !== 'range';
}
document.querySelectorAll('input[name=respawnType]').forEach(r => {
  r.addEventListener('change', e => toggleTypeFields(e.target.value));
});

addBossBtn.addEventListener('click', () => openBossModal(null));
editBossBtn.addEventListener('click', () => {
  const b = getActiveBoss();
  if(b) openBossModal(b);
});
document.getElementById('bossModalCancel').addEventListener('click', closeBossModal);

document.getElementById('bossModalSave').addEventListener('click', () => {
  const name = bossNameInput.value.trim();
  if(!name){ alert('請輸入王的名稱'); return; }
  const type = document.querySelector('input[name=respawnType]:checked').value;

  let fixedMinutes = null, minMinutes = null, maxMinutes = null;
  if(type === 'fixed'){
    fixedMinutes = (Number(fixedHour.value)||0)*60 + (Number(fixedMinute.value)||0);
    if(fixedMinutes <= 0){ alert('請輸入有效的重生時間'); return; }
  } else {
    minMinutes = (Number(minHour.value)||0)*60 + (Number(minMinute.value)||0);
    maxMinutes = (Number(maxHour.value)||0)*60 + (Number(maxMinute.value)||0);
    if(minMinutes <= 0 || maxMinutes <= 0 || maxMinutes < minMinutes){
      alert('請確認最短/最長重生時間設定正確（最長需大於等於最短）');
      return;
    }
  }

  if(editingBossId){
    const b = state.bosses.find(x => x.id === editingBossId);
    b.name = name; b.respawnType = type;
    b.fixedMinutes = fixedMinutes; b.minMinutes = minMinutes; b.maxMinutes = maxMinutes;
  } else {
    const newBoss = {
      id: genId(),
      name, respawnType: type,
      fixedMinutes, minMinutes, maxMinutes,
      channels: {}, kills: [], pinned: [],
      round: { start: CHANNEL_COUNT, checked: [], pass: 1 }, dismissed: []
    };
    state.bosses.push(newBoss);
    state.activeBossId = newBoss.id;
  }
  saveState();
  closeBossModal();
  renderBossSelector();
  renderAll();
});

clearAllBtn.addEventListener('click', () => {
  const b = getActiveBoss();
  if(!b) return;
  const count = Object.keys(b.channels).length;
  if(count === 0){ alert('目前沒有任何頻道計時可清除。'); return; }
  if(!confirm('確定要清除「'+b.name+'」全部 '+count+' 個頻道的計時嗎？\n（累計擊殺數不會被扣除；要歸零請按「累計歸零」）')) return;
  b.channels = {};
  saveState();
  renderAll();
});

deleteBossBtn.addEventListener('click', () => {
  const b = getActiveBoss();
  if(!b) return;
  if(!confirm('確定要刪除「'+b.name+'」嗎？此操作將刪除該王所有頻道的擊殺紀錄與累計數，且無法復原。')) return;
  state.bosses = state.bosses.filter(x => x.id !== b.id);
  state.activeBossId = state.bosses.length ? state.bosses[0].id : null;
  saveState();
  renderBossSelector();
  renderAll();
});

function resetCounts(){
  const b = getActiveBoss();
  if(!b) return;
  if(!confirm('確定要把「'+b.name+'」的累計擊殺數歸零嗎？（頻道計時會保留）')) return;
  b.kills = [];
  saveState();
  renderAll();
}

// ---------- Manual time modal ----------
const timeModalOverlay = document.getElementById('timeModalOverlay');
const timeModalChannel = document.getElementById('timeModalChannel');
const manualTimeInput = document.getElementById('manualTimeInput');
let editingChannel = null;

function openTimeModal(channelNum){
  editingChannel = channelNum;
  timeModalChannel.textContent = '頻道 ' + channelNum;
  const boss = getActiveBoss();
  const rec = boss.channels[channelNum];
  manualTimeInput.value = toLocalDatetimeInputValue(rec ? rec.ts : Date.now());
  const by = rec ? rec.by : 'me';
  document.querySelectorAll('input[name=timeOwner]').forEach(r => r.checked = (r.value === by));
  timeModalOverlay.hidden = false;
}
document.getElementById('timeModalCancel').addEventListener('click', () => timeModalOverlay.hidden = true);
document.getElementById('timeModalSave').addEventListener('click', () => {
  const boss = getActiveBoss();
  if(!boss || editingChannel == null) return;
  const val = manualTimeInput.value;
  if(!val) return;
  const ts = new Date(val).getTime();
  if(isNaN(ts)) return;
  const by = document.querySelector('input[name=timeOwner]:checked').value;
  const rec = boss.channels[editingChannel];
  if(rec){
    // 修改既有紀錄，不算新的一次擊殺
    rec.ts = ts; rec.by = by;
    const log = findLog(boss, rec);
    if(log){ log.ts = ts; log.by = by; }
  } else {
    addKill(boss, editingChannel, ts, by);
  }
  saveState();
  timeModalOverlay.hidden = true;
  renderAll();
});

// ---------- Channel actions ----------
function kill(channelNum, by){
  const boss = getActiveBoss();
  if(!boss) return;
  addKill(boss, channelNum, Date.now(), by);
  saveState();
  renderAll();
}
function toggleOwner(channelNum){
  const boss = getActiveBoss();
  const rec = boss && boss.channels[channelNum];
  if(!rec) return;
  rec.by = rec.by === 'me' ? 'other' : 'me';
  const log = findLog(boss, rec);
  if(log) log.by = rec.by;
  saveState();
  renderAll();
}
function clearChannel(channelNum){
  const boss = getActiveBoss();
  if(!boss) return;
  if(!confirm('確定要清除頻道 ' + channelNum + ' 的這筆擊殺嗎？\n（視為按錯，會從累計擊殺數扣掉這一筆）')) return;
  const rec = boss.channels[channelNum];
  if(rec) boss.kills = boss.kills.filter(k => k.id !== rec.logId);
  delete boss.channels[channelNum];
  saveState();
  renderAll();
}
function togglePin(channelNum){
  const boss = getActiveBoss();
  if(!boss) return;
  const i = boss.pinned.indexOf(channelNum);
  if(i >= 0) boss.pinned.splice(i, 1); else boss.pinned.push(channelNum);
  saveState();
  renderAll();
}
function jumpToChannel(ch){
  const el = document.getElementById('card-ch-' + ch);
  if(!el) return;
  window.focus();
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}

// ---------- Grid ----------
const STATE_LABEL = { idle:'尚未記錄', waiting:'等待重生', window:'重生區間中', ready:'王已重生' };

function buildCard(boss, channelNum, status, withId){
  const rec = boss.channels[channelNum] || null;
  const pinned = boss.pinned.includes(channelNum);

  const card = document.createElement('div');
  card.className = 'card ' + status.state + (rec ? ' ' + rec.by : '');
  if(withId) card.id = 'card-ch-' + channelNum;

  const head = document.createElement('div');
  head.className = 'ch-head';
  const num = document.createElement('span');
  num.className = 'ch-num';
  num.textContent = '頻道 ' + channelNum;
  head.appendChild(num);
  if(rec){
    const badge = document.createElement('button');
    badge.className = 'owner-badge ' + rec.by;
    badge.textContent = rec.by === 'me' ? '我' : '別人';
    badge.title = '點擊切換 自己 / 別人';
    badge.addEventListener('click', () => toggleOwner(channelNum));
    head.appendChild(badge);
  }
  const pinBtn = document.createElement('button');
  pinBtn.className = 'pin-btn' + (pinned ? ' on' : '');
  pinBtn.textContent = '📌';
  pinBtn.title = pinned ? '取消置頂' : '置頂此頻道';
  pinBtn.addEventListener('click', () => togglePin(channelNum));
  head.appendChild(pinBtn);
  card.appendChild(head);

  const tag = document.createElement('div');
  tag.className = 'status-tag';
  tag.textContent = STATE_LABEL[status.state];
  card.appendChild(tag);

  const info = document.createElement('div');
  info.className = 'info-line';
  const countdown = document.createElement('div');
  countdown.className = 'countdown';

  if(status.state === 'idle'){
    countdown.textContent = '--:--:--';
  } else {
    const killTimeStr = formatClock(new Date(rec.ts));
    if(status.state === 'waiting'){
      info.textContent = '擊殺 ' + killTimeStr + ' · 預計 ' + formatClock(new Date(status.targetTime)) + (boss.respawnType==='range' ? '~'+formatClock(new Date(status.maxTime)) : '');
      countdown.textContent = formatDuration(status.remainingMs);
    } else if(status.state === 'window'){
      info.textContent = '擊殺 ' + killTimeStr + ' · 最晚 ' + formatClock(new Date(status.targetTime));
      countdown.textContent = formatDuration(status.remainingMs) + ' 內';
    } else if(status.state === 'ready'){
      info.textContent = '擊殺 ' + killTimeStr + ' · 已超時';
      countdown.textContent = '+' + formatDuration(status.overdueMs);
    }
  }
  card.appendChild(info);
  card.appendChild(countdown);

  const row1 = document.createElement('div');
  row1.className = 'card-actions';
  const meBtn = document.createElement('button');
  meBtn.className = 'btn-me';
  meBtn.textContent = '我擊殺';
  meBtn.addEventListener('click', () => kill(channelNum, 'me'));
  const otherBtn = document.createElement('button');
  otherBtn.className = 'btn-other';
  otherBtn.textContent = '別人擊殺';
  otherBtn.addEventListener('click', () => kill(channelNum, 'other'));
  row1.append(meBtn, otherBtn);
  card.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'card-actions';
  const editBtn = document.createElement('button');
  editBtn.textContent = '✎ 時間';
  editBtn.addEventListener('click', () => openTimeModal(channelNum));
  row2.appendChild(editBtn);
  if(rec){
    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn-danger';
    clearBtn.textContent = '清除';
    clearBtn.addEventListener('click', () => clearChannel(channelNum));
    row2.appendChild(clearBtn);
  }
  card.appendChild(row2);

  return card;
}

function makeGrid(boss, items, withId){
  const wrap = document.createElement('div');
  wrap.className = 'grid-scroll';
  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach(it => grid.appendChild(buildCard(boss, it.ch, it.status, withId)));
  wrap.appendChild(grid);
  return wrap;
}

// 「我的擊殺」列：主畫面與浮動小視窗共用
function myBarHTML(boss, statusByCh){
  const c = countKills(boss);
  let allMe = 0;
  state.bosses.forEach(b => b.kills.forEach(k => { if(k.by === 'me') allMe++; }));

  const chips = [];
  for(let ch = 1; ch <= CHANNEL_COUNT; ch++){
    const rec = boss.channels[ch];
    if(!rec || rec.by !== 'me') continue;
    const s = statusByCh[ch];
    let text;
    if(s.state === 'waiting') text = formatDuration(s.remainingMs);
    else if(s.state === 'window') text = '區間 ' + formatDuration(s.remainingMs);
    else text = '已重生';
    chips.push('<button class="chip ' + s.state + '" data-ch="' + ch + '">' + ch + '頻 · ' + text + '</button>');
  }

  const t = countToday(boss);
  return '<div class="mybar-stats">'
    + '<span>🗡️ <b>' + esc(boss.name) + '</b></span>'
    + '<span class="stat-me">今天我擊殺 <b>' + t.me + '</b> 隻</span>'
    + '<span class="stat-other">今天別人 <b>' + t.other + '</b> 隻</span>'
    + '<span class="stat-me">累積我 <b>' + c.me + '</b></span>'
    + '<span class="stat-other">累積別人 <b>' + c.other + '</b></span>'
    + '<span>累積合計 <b>' + c.total + '</b></span>'
    + (state.bosses.length > 1 ? '<span>所有王我共擊殺 <b>' + allMe + '</b> 隻</span>' : '')
    + '<button data-act="daily">📅 每日統計</button>'
    + '<button data-act="heat">🔥 時間熱點</button>'
    + '<button data-act="reset">累計歸零</button>'
    + '</div>'
    + '<div class="chips">' + (chips.length ? chips.join('') : '<span class="none">目前沒有自己擊殺中的頻道</span>') + '</div>';
}

function onBarClick(e){
  const chip = e.target.closest('[data-ch]');
  if(chip){ jumpToChannel(Number(chip.dataset.ch)); return; }
  if(e.target.closest('[data-act=reset]')) resetCounts();
  if(e.target.closest('[data-act=daily]')) openDailyModal();
  if(e.target.closest('[data-act=heat]')) openHeatModal();
}
myBar.addEventListener('click', onBarClick);

    + rows.map(r => {

// ---------- 時間熱點 ----------
const heatModalOverlay = document.getElementById('heatModalOverlay');
const heatScope = document.getElementById('heatScope');
const heatWho = document.getElementById('heatWho');
const heatRange = document.getElementById('heatRange');
const heatBody = document.getElementById('heatBody');
// 週一排第一列；getDay() 的 0 是週日
const HEAT_DAYS = [1,2,3,4,5,6,0];
const WEEKDAY = ['日','一','二','三','四','五','六'];

function heatCell(n, max){
  if(!n) return '<td class="zero"></td>';
  const r = n / max;
  return '<td style="background:rgba(var(--heat-rgb),' + (0.15 + 0.85*r).toFixed(2) + ')' + (r > 0.55 ? ';color:#fff' : '') + '">' + n + '</td>';
}
function hourLabel(h){ return pad(h) + ':00–' + pad((h+1)%24) + ':00'; }

function renderHeat(){
  const boss = getActiveBoss();
  let kills = heatScope.value === 'all'
    ? state.bosses.flatMap(b => b.kills)
    : (boss ? boss.kills : []);
  if(heatWho.value !== 'all') kills = kills.filter(k => k.by === heatWho.value);
  const days = Number(heatRange.value);
  if(days){
    const since = Date.now() - days*86400000;
    kills = kills.filter(k => k.ts >= since);
  }
  if(!kills.length){
    heatBody.innerHTML = '<div class="empty-hint">這個範圍內沒有擊殺紀錄</div>';
    return;
  }

  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const byHour = new Array(24).fill(0);
  const byDay = new Array(7).fill(0);
  kills.forEach(k => {
    const d = new Date(k.ts);
    grid[d.getDay()][d.getHours()]++;
    byHour[d.getHours()]++;
    byDay[d.getDay()]++;
  });
  const maxCell = Math.max(...grid.flat());
  const maxHour = Math.max(...byHour);

  // 最熱的 3 個小時（不分星期）
  const top = byHour.map((n, h) => ({ h, n })).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 3);
  const topHTML = '<div class="heat-top">共 ' + kills.length + ' 筆 · 最常出現：'
    + top.map(x => '<b>' + hourLabel(x.h) + '</b>（' + x.n + ' 隻，' + Math.round(x.n / kills.length * 100) + '%）').join('、')
    + '</div>';

  let hoursHead = '<th class="lbl"></th>';
  for(let h = 0; h < 24; h++) hoursHead += '<th>' + h + '</th>';
  hoursHead += '<th class="sum">合計</th>';

  const rows = HEAT_DAYS.map(dw => {
    let tr = '<tr><th class="lbl">週' + WEEKDAY[dw] + '</th>';
    for(let h = 0; h < 24; h++) tr += heatCell(grid[dw][h], maxCell);
    return tr + '<td class="sum">' + byDay[dw] + '</td></tr>';
  }).join('');

  let totalRow = '<tr class="total"><th class="lbl">每小時合計</th>';
  for(let h = 0; h < 24; h++) totalRow += heatCell(byHour[h], maxHour);
  totalRow += '<td class="sum">' + kills.length + '</td></tr>';

  heatBody.innerHTML = topHTML
    + '<div class="heat-scroll"><table class="heat-table"><thead><tr>' + hoursHead + '</tr></thead><tbody>'
    + rows + totalRow + '</tbody></table></div>';
}
function openHeatModal(){
  window.focus();
  renderHeat();
  heatModalOverlay.hidden = false;
}
[heatScope, heatWho, heatRange].forEach(el => el.addEventListener('change', renderHeat));
document.getElementById('heatModalClose').addEventListener('click', () => heatModalOverlay.hidden = true);

function renderAll(){
  const boss = getActiveBoss();
  gridArea.innerHTML = '';
  if(!boss){
    summaryEl.hidden = true;
    myBar.hidden = true;
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '尚未設定任何王，請點擊上方「+ 新增王」開始設定重生時間。';
    gridArea.appendChild(hint);
    renderMini(null, null);
    return;
  }
  summaryEl.hidden = false;
  myBar.hidden = false;
  sortModeSelect.value = state.sortMode || 'channel';

  const now = Date.now();
  const statusByCh = {};
  let cntWindow = 0, cntReady = 0, cntWaiting = 0;
  const built = [];
  for(let ch = 1; ch <= CHANNEL_COUNT; ch++){
    const rec = boss.channels[ch];
    const status = computeStatus(boss, rec ? rec.ts : null, now);
    statusByCh[ch] = status;
    if(status.state === 'window') cntWindow++;
    else if(status.state === 'ready') cntReady++;
    else if(status.state === 'waiting') cntWaiting++;
    built.push({ ch, status });
  }

  document.getElementById('cntWindow').textContent = cntWindow;
  document.getElementById('cntReady').textContent = cntReady;
  document.getElementById('cntWaiting').textContent = cntWaiting;

  myBar.innerHTML = myBarHTML(boss, statusByCh);

  const priority = { ready:0, window:1, waiting:2, idle:3 };
  if(state.sortMode === 'time'){
    built.sort((a,b) => {
      if(priority[a.status.state] !== priority[b.status.state]) return priority[a.status.state]-priority[b.status.state];
      if(a.status.state === 'ready') return (b.status.overdueMs||0) - (a.status.overdueMs||0);
      if(a.status.state === 'window' || a.status.state === 'waiting') return (a.status.remainingMs||0) - (b.status.remainingMs||0);
      return a.ch - b.ch;
    });
  }

  // 置頂頻道
  const pinnedItems = boss.pinned.filter(ch => ch >= 1 && ch <= CHANNEL_COUNT).map(ch => ({ ch, status: statusByCh[ch] }));
  if(pinnedItems.length){
    const h = document.createElement('h3');
    h.textContent = '📌 置頂頻道';
    gridArea.appendChild(h);
    gridArea.appendChild(makeGrid(boss, pinnedItems, false));
    const h2 = document.createElement('h3');
    h2.textContent = '全部頻道';
    gridArea.appendChild(h2);
  }
  gridArea.appendChild(makeGrid(boss, built, true));

  renderMini(boss, statusByCh);
}

// ---------- 浮動小視窗（永遠在最上層） ----------
let miniWin = null;

async function openMini(){
  if(miniWin && !miniWin.closed){ miniWin.focus(); return; }
  try{
    if('documentPictureInPicture' in window){
      miniWin = await documentPictureInPicture.requestWindow({ width: 360, height: 600 });
    } else {
      miniWin = window.open('', 'maple_mini', 'width=360,height=640');
      if(!miniWin){ alert('瀏覽器封鎖了彈出視窗，請允許後再試。'); return; }
      alert('此瀏覽器不支援「永遠在最上層」小視窗（需 Chrome 或 Edge 116 以上），已改開一般小視窗。');
    }
  }catch(e){
    alert('無法開啟浮動小視窗：' + e.message);
    return;
  }
  const d = miniWin.document;
  d.title = '我的擊殺';
  const st = d.createElement('style');
  st.textContent = document.querySelector('style').textContent;
  d.head.appendChild(st);
  d.body.className = 'mini';
  // 輪次控制列不跟著每秒重繪，輸入框才不會被打斷
  d.body.innerHTML = '<div class="mybar" id="miniWrap">'
    + '<div id="miniBar"></div>'
    + '<div class="mini-round">從 <input type="number" id="miniStart" min="1" max="' + CHANNEL_COUNT + '"> 頻開始'
    + '<button class="pass-btn" data-pass="1" title="重新開始：60 個頻道全掃（等待重生中的除外）">第一次・全掃</button>'
    + '<button class="pass-btn" data-pass="2" title="只掃第一次沒被打掉的頻道">第二次・補掃</button></div>'
    + '</div>';
  // 每秒重繪會換掉按鈕，用 pointerdown 才不會漏掉點擊
  d.getElementById('miniWrap').addEventListener('pointerdown', onMiniClick);
  // 滑鼠滾輪不要改到起始頻道
  d.getElementById('miniStart').addEventListener('wheel', e => e.preventDefault(), { passive: false });
  d.getElementById('miniStart').addEventListener('change', e => {
    const boss = getActiveBoss();
    if(!boss) return;
    boss.round.start = clampCh(e.target.value);
    e.target.value = boss.round.start;
    saveState();
    renderAll();
  });
  miniWin.addEventListener('pagehide', () => { miniWin = null; });
  renderAll();
}
document.getElementById('miniBtn').addEventListener('click', openMini);

function clampCh(v){
  const n = Math.round(Number(v));
  if(!n || n < 1) return 1;
  return Math.min(n, CHANNEL_COUNT);
}

// 切換第一次 / 第二次：本輪手動清除的紀錄歸零。
// 第二次的清單自然就是「沒被打掉的頻道」，因為打掉的都在等待重生中
function setPass(boss, pass){
  const input = miniWin && miniWin.document.getElementById('miniStart');
  if(input) boss.round.start = clampCh(input.value);
  boss.round.pass = pass;
  boss.round.checked = [];
  saveState();
  renderAll();
}

function onMiniClick(e){
  const boss = getActiveBoss();
  if(!boss) return;
  const ok = e.target.closest('[data-check]');
  if(ok){
    ok.dataset.check.split(',').map(Number).forEach(ch => {
      if(!boss.round.checked.includes(ch)) boss.round.checked.push(ch);
    });
    saveState();
    renderAll();
    return;
  }
  const pass = e.target.closest('[data-pass]');
  if(pass){ setPass(boss, Number(pass.dataset.pass)); return; }
  // 區間中但其實還沒重生：從「最接近重生」移除，讓後面的頻道顯示出來
  const dis = e.target.closest('[data-dismiss]');
  if(dis){
    const rec = boss.channels[Number(dis.dataset.dismiss)];
    if(rec){
      const live = Object.values(boss.channels).map(r => r.logId);
      boss.dismissed = boss.dismissed.filter(id => live.includes(id));
      boss.dismissed.push(rec.logId);
      saveState();
      renderAll();
    }
    return;
  }
  onBarClick(e);
}

// 掃頻順序：從起始頻道往 1 頻倒數，再從 60 頻繞回起始頻道的上一頻
function sweepOrder(start){
  const order = [];
  for(let ch = start; ch >= 1; ch--) order.push(ch);
  for(let ch = CHANNEL_COUNT; ch > start; ch--) order.push(ch);
  return order;
}

// 連續頻道合併成區段（例：60–56、54–6），每段是按鈕，點一下清除這段
function rangesHTML(list){
  const out = [];
  for(let i = 0; i < list.length; ){
    let j = i;
    while(j + 1 < list.length && list[j + 1] === list[j] - 1) j++;
    const label = i === j ? String(list[i]) : list[i] + '–' + list[j];
    out.push('<button class="range-btn" data-check="' + list.slice(i, j + 1).join(',') + '" title="點一下清除這段">' + label + '</button>');
    i = j + 1;
  }
  return out.join('、');
}

function miniHTML(boss, statusByCh){
  const r = boss.round;
  const start = r.start || CHANNEL_COUNT;
  // 要掃的頻道：扣掉等待重生中（已被打掉）與本輪手動清除的
  const todo = sweepOrder(start).filter(ch => statusByCh[ch].state !== 'waiting' && !r.checked.includes(ch));
  // 我上次打過、現在已重生（區間中或已重生）的頻道優先掃
  const isMine = ch => boss.channels[ch] && boss.channels[ch].by === 'me';
  const prio = todo.filter(isMine);
  const rest = todo.filter(ch => !isMine(ch));
  const next = prio.length ? prio[0] : rest[0];

  // 我 / 別人打掉的王，下次最早重生時間
  const earliest = { me: null, other: null };
  for(let ch = 1; ch <= CHANNEL_COUNT; ch++){
    const s = statusByCh[ch];
    if(s.state !== 'waiting') continue;
    const by = boss.channels[ch].by;
    if(!earliest[by] || s.targetTime < earliest[by].t) earliest[by] = { t: s.targetTime, ms: s.remainingMs, ch };
  }
  const earlyLine = (by, label) => {
    const e = earliest[by];
    return '<div class="early ' + by + '">' + label + ' 最早重生：'
      + (e ? '<b>' + formatClock(new Date(e.t)) + '</b>（' + formatDuration(e.ms) + ' 後 · ' + e.ch + ' 頻）' : '—')
      + '</div>';
  };

  // 最接近重生：區間中的排最前，再依剩餘時間由短到長；手動移除的區間頻道不列出
  const soon = [];
  for(let ch = 1; ch <= CHANNEL_COUNT; ch++){
    const s = statusByCh[ch];
    if(s.state === 'window' && boss.dismissed.includes(boss.channels[ch].logId)) continue;
    if(s.state === 'waiting' || s.state === 'window') soon.push({ ch, s });
  }
  soon.sort((a, b) => {
    if(a.s.state !== b.s.state) return a.s.state === 'window' ? -1 : 1;
    return a.s.remainingMs - b.s.remainingMs;
  });
  const soonRows = soon.slice(0, 5).map((it, i) => {
    const by = boss.channels[it.ch].by === 'me' ? '我' : '別人';
    const isWin = it.s.state === 'window';
    const text = isWin ? '區間中 · 最晚 ' + formatDuration(it.s.remainingMs) : formatDuration(it.s.remainingMs);
    return '<div class="soon-row ' + it.s.state + (i === 0 ? ' top' : '') + '">'
      + '<span class="soon-jump" data-ch="' + it.ch + '"><span>' + it.ch + ' 頻（' + by + '）</span><span>' + text + '</span></span>'
      + (isWin ? '<button class="soon-x" data-dismiss="' + it.ch + '" title="還沒重生，先從這裡移除">✕</button>' : '')
      + '</div>';
  });

  const passLabel = r.pass === 2 ? '第二次・補掃沒被打掉的' : '第一次・60 頻全掃';
  let sweep;
  if(todo.length){
    sweep = '<div class="mini-next"><span>下一個：<b>' + next + ' 頻</b></span>'
      + '<button data-check="' + next + '" title="這頻看過沒王，從清單移除">✓ 看過，下一個</button></div>'
      + '<div class="mini-label">' + passLabel + ' · 剩 ' + todo.length + ' 頻</div>'
      + (prio.length ? '<div class="mini-label">⭐ 先掃（我打過、已重生）</div><div class="mini-ranges prio">' + rangesHTML(prio) + '</div>' : '')
      + (rest.length ? (prio.length ? '<div class="mini-label">其他頻道</div>' : '') + '<div class="mini-ranges">' + rangesHTML(rest) + '</div>' : '');
  } else if(r.pass === 2){
    sweep = '<div class="mini-next">兩次都掃完了 🎉</div>'
      + '<button class="btn-primary" data-pass="1">開始新一輪（第一次・全掃）</button>';
  } else {
    sweep = '<div class="mini-next">第一次掃完了</div>'
      + '<button class="btn-primary" data-pass="2">開始第二次（補掃沒被打掉的）</button>';
  }

  const c = countKills(boss);
  const t = countToday(boss);
  return '<div class="mybar-stats">'
    + '<span>🗡️ <b>' + esc(boss.name) + '</b></span>'
    + '<span class="stat-me">今天我 <b>' + t.me + '</b></span>'
    + '<span class="stat-other">別人 <b>' + t.other + '</b></span>'
    + '<span>累積我 <b>' + c.me + '</b> / 合計 ' + c.total + '</span>'
    + '</div>'
    + earlyLine('me', '🟢 我打的') + earlyLine('other', '🟣 別人打的')
    + sweep
    + '<div class="mini-label">⏰ 最接近重生</div>'
    + (soonRows.length
      ? '<div class="soon-list">' + soonRows.join('') + '</div>'
      : '<div class="mini-label">目前沒有等待重生的頻道</div>');
}

function renderMini(boss, statusByCh){
  if(!miniWin || miniWin.closed) return;
  const d = miniWin.document;
  const el = d.getElementById('miniBar');
  if(!el) return;
  el.innerHTML = boss ? miniHTML(boss, statusByCh) : '<span class="none">尚未設定任何王</span>';
  d.querySelectorAll('.pass-btn').forEach(b => {
    b.disabled = !boss;
    b.classList.toggle('btn-primary', !!boss && Number(b.dataset.pass) === (boss.round.pass || 1));
  });
  const startInput = d.getElementById('miniStart');
  if(startInput && d.activeElement !== startInput){
    startInput.value = boss ? boss.round.start : '';
    startInput.disabled = !boss;
  }
}

// ---------- Clock & init ----------
function tickClock(){
  document.getElementById('clock').textContent = formatClock(new Date());
}
setInterval(() => { tickClock(); renderAll(); }, 1000);
tickClock();

if(!state.activeBossId && state.bosses.length) state.activeBossId = state.bosses[0].id;
saveState();
renderBossSelector();
renderAll();
</script>
